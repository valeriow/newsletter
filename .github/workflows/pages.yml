name: Site — build e deploy (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ["Podcast — gerar áudio dos roteiros"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Coletar metadados dos áudios e preparar publicação estática no GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _data assets/audio
          gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" > releases.json
          python3 - <<'EOF'
          import json, re, urllib.request, os

          rels = json.load(open("releases.json"))
          if isinstance(rels, dict): rels = [rels]
          audio = {}
          for r in rels:
              tag = r.get("tag_name", "")
              if not tag.startswith("podcast-"): continue
              ep = tag[len("podcast-"):]
              assets = {a["name"]: a for a in r.get("assets", [])}
              a = assets.get(f"{ep}.mp3")
              if a:
                  meta = {}
                  j = assets.get(f"{ep}.json")
                  if j:
                      try:
                          meta = json.load(urllib.request.urlopen(j["browser_download_url"]))
                      except Exception as e:
                          print("meta indisponível:", ep, e)

                  dest_mp3 = f"assets/audio/{ep}.mp3"
                  print(f"Baixando {ep}.mp3 para servir via GitHub Pages...")
                  try:
                      req = urllib.request.Request(a["browser_download_url"], headers={"User-Agent": "Mozilla/5.0"})
                      with urllib.request.urlopen(req) as resp, open(dest_mp3, "wb") as out:
                          out.write(resp.read())
                  except Exception as e:
                      print(f"Erro ao baixar {ep}.mp3:", e)

                  base_url = "https://valeriow.github.io/newsletter"
                  audio[ep] = {
                      "url": f"{base_url}/assets/audio/{ep}.mp3",
                      "bytes": a.get("size", meta.get("bytes", 0)),
                      "duracao_seg": meta.get("duracao_seg", 0),
                      "publicado": r.get("published_at", ""),
                  }
          json.dump(audio, open("_data/audio.json", "w"), ensure_ascii=False, indent=1)
          print(json.dumps(audio, indent=1, ensure_ascii=False))
          EOF

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
