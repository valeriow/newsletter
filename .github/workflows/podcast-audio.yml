name: Podcast — gerar áudio dos roteiros

on:
  push:
    branches: [main]
    paths: ["_podcast/**", "scripts/gerar_audio.py", ".github/workflows/podcast-audio.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: podcast-audio
  cancel-in-progress: false

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          pip install -q edge-tts pyyaml

      - name: Gerar áudios que ainda não existem
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          for roteiro in _podcast/*.md; do
            ep=$(python3 -c "import yaml,re; t=open('$roteiro',encoding='utf-8').read(); m=re.match(r'---\n(.*?)\n---',t,re.S); f=yaml.safe_load(m.group(1)); print(f.get('episodio') or f\"{f['semana']}-{f['versao']}\")")
            tag="podcast-$ep"
            asset="$ep.mp3"
            if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$asset"; then
              echo "já existe: $asset"; continue
            fi
            echo "gerando $asset a partir de $roteiro"
            python3 scripts/gerar_audio.py "$roteiro" "$asset" --capa assets/img/avatar.png | tee "log-$ep.txt"
            meta=$(tail -n 1 "log-$ep.txt")
            echo "$meta" > "$ep.json"
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" --title "Podcast Radar IA — $ep" --notes "Áudio gerado automaticamente a partir do roteiro $ep." --latest=false
            fi
            gh release upload "$tag" "$asset" "$ep.json" --clobber
          done
