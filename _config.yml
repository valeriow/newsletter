title: Radar IA
description: Radar IA — monitoramento diário de novidades em IA agêntica, open source, setor público e IA aplicada.
lang: pt-BR
timezone: America/Sao_Paulo
url: "https://valeriow.github.io"
baseurl: "/newsletter"
# Google Analytics 4 — ID de medição (G-XXXXXXXXXX). Vazio desativa.
google_analytics: "G-EC02PD3B27"
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
plugins:
  - jekyll-feed
defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: post }
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
