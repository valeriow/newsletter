<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% include analytics.html %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='Inter,Arial' font-size='17' font-weight='700' fill='white' text-anchor='middle'%3EIA%3C/text%3E%3C/svg%3E">
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <span class="brand__mark">IA</span>
        <span class="brand__text">{{ site.title }}</span>
      </a>
      <nav class="topnav" aria-label="Principal">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Edições</a>
        <a href="{{ '/sobre/' | relative_url }}"{% if page.url == '/sobre/' %} aria-current="page"{% endif %}>Sobre</a>
        <a href="{{ '/feed.xml' | relative_url }}" title="Feed RSS/Atom">Feed</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="wrap">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span>{{ site.title }} · edições geradas automaticamente a partir de fontes públicas.</span>
      <a href="https://github.com/valeriow/newsletter">Repositório no GitHub</a>
    </div>
  </footer>
</body>
</html>
