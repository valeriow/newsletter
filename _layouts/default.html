<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
  {% include analytics.html %}
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/icon.svg' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/assets/img/avatar.png' | relative_url }}">
  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 200 }}">
  <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/og.png' | absolute_url }}">
  <meta name="twitter:card" content="summary_large_image">
</head>
<body>
  <a class="skip" href="#conteudo">Ir para o conteúdo</a>
  <header class="topbar">
    <div class="wrap topbar__inner">
      <a class="brand" href="{{ '/' | relative_url }}">
        <img class="brand__icon" src="{{ '/assets/img/icon.svg' | relative_url }}" alt="" width="30" height="30">
        <span class="brand__text">Radar <span class="brand__accent">IA</span></span>
      </a>
      <nav class="topnav" aria-label="Principal">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Edições</a>
        <a href="{{ '/sobre/' | relative_url }}"{% if page.url == '/sobre/' %} aria-current="page"{% endif %}>Sobre</a>
        <a href="{{ '/feed.xml' | relative_url }}" title="Feed RSS/Atom">Feed</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="wrap">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="wrap footer__inner">
      <span>{{ site.title }} · edições geradas automaticamente a partir de fontes públicas.</span>
    </div>
  </footer>
</body>
</html>
